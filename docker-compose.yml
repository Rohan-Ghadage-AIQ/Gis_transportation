services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gis_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gis_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always